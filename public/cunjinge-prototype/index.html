<main class="app" id="app"><header class="top"><div class="brand">灵山大掌门<small>寸金阁玩法试玩</small></div><div class="status" id="topStatus"></div><div class="top-actions"><button class="mini jade" id="fastBtn">试玩加速</button><button class="mini" id="resetBtn">重置</button></div></header><section class="stage">
<div class="lobby panel" id="lobby"><div class="lobby-head"><div><h1>万宝会今日开阁</h1><p>每次最多竞拍3匣，三个房间共用同一筹码钱包；本试玩从第7天开放日开始。</p></div><div><b>鉴宝师 Lv.1</b><br><small>阅历 0 / 150</small></div></div><div class="wallet"><span>宗门灵石 <b id="spirit">30000</b></span><span>临时筹码 <b id="chips">0</b></span><button class="chip-btn" data-exchange="500">兑换500</button><button class="chip-btn" data-exchange="5000">兑换5000</button><button class="chip-btn" data-exchange="20000">兑换20000</button><button class="chip-btn" data-exchange="all">兑换全部</button></div><div class="rooms" id="rooms"></div><div class="lobby-foot"><span>试玩规则：离阁退回剩余筹码；兑换时保留至少500灵石或15%运营金。</span><button class="tutorial" id="tutorialBtn">先玩免费教学匣</button></div></div>
<div class="arena hidden" id="arena"><section class="chest-panel panel"><div class="chest-head"><b id="chestTitle">玄纹宝匣</b><span id="chestMeta"></span></div><div class="grid" id="grid"></div><div class="legend">轮廓公开，品质与价值在开箱前隐藏</div></section><section class="right"><div class="players" id="players"></div><div class="decision panel"><div class="clues"><div class="section-title">公共线索 · 逐轮增强</div><div class="clue-list" id="clues"></div></div><div class="appraisal"><div class="section-title">私人鉴宝 <span id="uses"></span></div><div class="estimate" id="estimate"></div><div class="arts" id="arts"></div><div class="art-log" id="artLog"></div></div></div><div class="bidding panel"><button class="quick" data-bid="safe">保守 80%</button><button class="quick" data-bid="reference">参考 100%</button><button class="quick" data-bid="bold">激进 120%</button><button class="quick" data-bid="follow">跟价 +5</button><div class="bidbox"><span>筹码</span><input id="bidInput" inputmode="numeric" type="number" min="0" value="0"></div><button class="submit" id="submitBid">确认报价</button></div></section></div></section>
<div class="result hidden" id="result"><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stats"><div class="stat">成交价<b id="dealValue"></b></div><div class="stat">宝匣总值<b id="actualValue"></b></div><div class="stat">玩家盈亏<b id="profitValue"></b></div></div><div class="result-actions"><button id="leaveBtn">离开寸金阁</button><button id="nextBtn">继续下一匣</button></div></div></div></main>
<script>
(()=>{const rooms=[{id:'market',name:'散修集市',chips:500,rep:0,min:300,max:1500,color:'散修、旧货与偶遇的小机缘'},{id:'cloud',name:'云海宝会',chips:5000,rep:100,min:3000,max:15000,color:'行家汇聚，紫色宝物开始常见'},{id:'heaven',name:'九霄仙拍',chips:20000,rep:300,min:12000,max:80000,color:'高风险高回报，偶见金色重宝'}],npcs=[['丹霞子','丹修',.93,.08],['顾听剑','剑修',1.05,.12],['金算盘','行商',.98,.16],['沈绛雪','丹修',1.08,.06],['燕回雪','剑修',.9,.14],['白掌柜','行商',1.02,.1],['百草翁','丹修',.87,.05],['宁藏锋','剑修',1.1,.13],['钱有余','行商',.95,.18]],names=['百年灵草','月华露','赤焰莲','云纹芝','聚灵丹','筑基丹','凝剑丸','化神丹','灵矿原石','星纹铁','寒髓玉','大日精金','青锋剑','霜魄古剑','纳灵葫芦','护心玉佩','小周天阵盘','三足丹炉','残破万妖幡','无名道印','百草残卷','御剑残篇','阵道秘录','天书残页','雷击灵木','上古香炉','仙鹤尾羽','疑似龙鳞','玉蝉','星河砂'],shapes=[{w:1,h:1,c:1},{w:1,h:2,c:2},{w:2,h:1,c:2},{w:2,h:2,c:4}],rarity=['white','green','blue','purple','gold'],state={spirit:30000,rep:350,chips:0,chests:0,room:null,auction:null,fast:false,tutorialDone:false};let timer=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,maxExchange=()=>Math.max(0,state.spirit-Math.max(500,Math.ceil(state.spirit*.15)));
function toast(text){const el=document.createElement('div');el.className='toast';el.textContent=text;$('#app').append(el);setTimeout(()=>el.remove(),1850)}
function renderLobby(){clearInterval(timer);$('#lobby').classList.remove('hidden');$('#arena').classList.add('hidden');$('#result').classList.add('hidden');$('#spirit').textContent=state.spirit;$('#chips').textContent=state.chips;$('#topStatus').textContent=`第7天 · 声望${state.rep} · 已参与 ${state.chests}/3匣 · 剩余筹码离场自动退回`;$('#rooms').innerHTML=rooms.map(r=>{const why=state.chests>=3?'本次3匣已用完':state.rep<r.rep?`需要声望${r.rep}`:state.chips<r.chips?`需要${r.chips}筹码`:'';return `<article class="room ${r.id==='cloud'?'cloud':r.id==='heaven'?'high':''}"><h2>${r.name}</h2><p>${r.color}<br>入场筹码：${r.chips}<br>声望门槛：${r.rep}<br>宝匣价值：${r.min}～${r.max}</p><button data-room="${r.id}" ${why?'disabled':''}>${why||'进入竞拍'}</button></article>`}).join('');$$('[data-room]').forEach(b=>b.onclick=()=>startAuction(b.dataset.room,false));$('#tutorialBtn').disabled=state.tutorialDone;$('#tutorialBtn').textContent=state.tutorialDone?'教学已完成':'先玩免费教学匣'}
function exchange(amount){const n=amount==='all'?maxExchange():Math.min(Number(amount),maxExchange());if(n<=0)return toast('必须给宗门保留运营灵石');state.spirit-=n;state.chips+=n;renderLobby();toast(`已兑换${n}筹码`)}
function pickRarity(room){const x=Math.random();if(room.id==='market')return x<.46?0:x<.76?1:x<.94?2:3;if(room.id==='cloud')return x<.15?0:x<.42?1:x<.75?2:x<.95?3:4;return x<.05?0:x<.18?1:x<.47?2:x<.82?3:4}
function makeItems(room,tutorial){const count=tutorial?9:rand(8,18),used=new Set(),items=[];let gold=0;for(let i=0;i<count;i++){let shape=shapes[rand(0,shapes.length-1)],pos=null;for(let t=0;t<100;t++){const x=rand(0,10-shape.w),y=rand(0,8-shape.h),cells=[];for(let yy=0;yy<shape.h;yy++)for(let xx=0;xx<shape.w;xx++)cells.push(`${x+xx},${y+yy}`);if(cells.every(c=>!used.has(c))){pos={x,y,cells};break}}if(!pos)continue;pos.cells.forEach(c=>used.add(c));let ri=tutorial?Math.min(2,Math.floor(i/3)):pickRarity(room);if(ri===4&&gold>=2)ri=3;if(ri===4)gold++;items.push({name:names[(i*7+rand(0,names.length-1))%names.length],rarity:rarity[ri],shape,x:pos.x,y:pos.y,value:0})}const total=tutorial?680:rand(room.min,room.max),weights=items.map(i=>Math.pow(2.35,rarity.indexOf(i.rarity))*(.8+Math.random()*.4)),sum=weights.reduce((a,b)=>a+b,0);let assigned=0;items.forEach((it,i)=>{it.value=i===items.length-1?total-assigned:Math.max(1,Math.round(total*weights[i]/sum));assigned+=it.value});return items}
function createClues(items){const total=items.reduce((s,i)=>s+i.value,0),best=[...items].sort((a,b)=>b.value-a.value),rare=[...items].sort((a,b)=>rarity.indexOf(b.rarity)-rarity.indexOf(a.rarity))[0],largest=[...items].sort((a,b)=>b.shape.c-a.shape.c)[0];return [{text:`匣内约有${Math.max(8,items.length-2)}～${Math.min(18,items.length+2)}件宝物`,low:.38,high:1.65},{text:`最大宝物占${largest.shape.c}格，轮廓已经显现`,low:.52,high:1.42},{text:`探得一件${rare.rarity==='gold'?'金色':rare.rarity==='purple'?'紫色':'蓝绿色'}${rare.name}轮廓`,low:.64,high:1.28},{text:`问得：${best[0].name}约值${best[0].value}，${best[1].name}约值${best[1].value}`,low:.76,high:1.16},{text:`寸金阁给出的最低估值为${Math.floor(total*.9)}`,low:.88,high:1.08}].map((c,i)=>({...c,low:Math.floor(total*c.low),high:Math.ceil(total*c.high),round:i+1}))}
function startAuction(roomId,tutorial){const room=rooms.find(r=>r.id===roomId);if(!tutorial&&state.chests>=3)return;if(!tutorial&&state.chips<room.chips)return toast('筹码不足');const chosen=[...npcs].sort(()=>Math.random()-.5).slice(0,3),items=makeItems(room,tutorial);state.room=room;state.auction={tutorial,round:1,time:30,items,clues:createClues(items),npcs:chosen,bids:[],used:[],artLogs:[],draft:0,result:null};if(!tutorial)state.chests++;$('#lobby').classList.add('hidden');$('#arena').classList.remove('hidden');renderAuction();startTimer()}
function estimate(a){const c=a.clues[a.round-1];return{low:c.low,high:c.high,mid:Math.round((c.low+c.high)/2)}}function suggested(kind){const a=state.auction,e=estimate(a);if(kind==='safe')return Math.round(e.mid*.8);if(kind==='bold')return Math.round(e.mid*1.2);if(kind==='follow'){const last=a.bids.at(-1);return last?Math.max(last.player,...last.npcs)+5:e.mid}return e.mid}function npcBids(){const a=state.auction,e=estimate(a);return a.npcs.map((n,i)=>{const last=a.bids.at(-1)?.npcs[i]||0,confidence=.6+a.round*.075,bluff=a.round<5&&Math.random()<n[3]?1.12:1,target=e.mid*n[2]*confidence*bluff;return Math.max(0,Math.round((last*.25+target*.75)/5)*5)})}
function renderAuction(){const a=state.auction,e=estimate(a);$('#topStatus').textContent=`${state.room.name} · 第${a.round}/5轮 · ${Math.ceil(a.time)}秒 · 筹码${state.chips}`;$('#chestTitle').textContent=a.tutorial?'免费教学宝匣':'玄纹宝匣';$('#chestMeta').textContent=`${a.items.length}件 · 10×8仓格`;const last=a.bids.at(-1);$('#players').innerHTML=[['掌门','玩家'],...a.npcs.map(n=>[n[0],n[1]])].map((p,i)=>`<div class="player ${i===0?'me':''}"><div class="avatar">${p[0][0]}</div><div class="p-name">${p[0]} · ${p[1]}</div><div class="p-bid">${last?`上轮 ${i===0?last.player:last.npcs[i-1]}筹码`:'本轮密封报价中'}</div></div>`).join('');const grid=$('#grid');grid.innerHTML=Array(80).fill('<i class="cell"></i>').join('');a.items.forEach((it,index)=>{const d=document.createElement('div');d.className=`treasure ${a.result?'revealed r-'+it.rarity:''}`;d.style.left=`${it.x*10}%`;d.style.top=`${it.y*12.5}%`;d.style.width=`${it.shape.w*10}%`;d.style.height=`${it.shape.h*12.5}%`;if(a.result)d.textContent=it.name;d.style.transitionDelay=`${index*35}ms`;grid.append(d)});$('#clues').innerHTML=a.clues.slice(0,a.round).map((c,i)=>`<div class="clue ${i===a.round-1?'new':''}">${i+1}. ${c.text}</div>`).join('');$('#uses').textContent=`剩余${2-a.used.length}次`;$('#estimate').textContent=`当前公开估值：${e.low}～${e.high}`;const arts=[['shape','辨形术'],['aura','观气术'],['price','问价符'],['fake','排伪诀']];$('#arts').innerHTML=arts.map(x=>`<button class="art" data-art="${x[0]}" ${a.used.includes(x[0])||a.used.length>=2?'disabled':''}>${x[1]}</button>`).join('');$$('[data-art]').forEach(b=>b.onclick=()=>appraise(b.dataset.art));$('#artLog').innerHTML=a.artLogs.join('<br>');if(!a.draft)a.draft=Math.min(suggested('reference'),a.tutorial?580:state.chips);$('#bidInput').value=a.draft;$$('[data-bid]').forEach(b=>b.onclick=()=>{a.draft=Math.min(suggested(b.dataset.bid),a.tutorial?580:state.chips);$('#bidInput').value=a.draft;$$('[data-bid]').forEach(x=>x.classList.toggle('active',x===b))})}
function appraise(kind){const a=state.auction;if(a.used.length>=2||a.used.includes(kind))return;const best=[...a.items].sort((x,y)=>y.value-x.value);let text='';if(kind==='shape')text=`辨形：最大轮廓是一件${best[0].name}`;if(kind==='aura')text=`观气：${best.slice(0,3).map(x=>x.name+'呈'+x.rarity+'灵光').join('、')}`;if(kind==='price')text=`问价：${best.slice(0,2).map(x=>x.name+'='+x.value).join('、')}`;if(kind==='fake')text=a.items.some(x=>x.name.includes('残')||x.name.includes('原石'))?'排伪：发现一件低价值杂物':'排伪：未发现明显赝品';a.used.push(kind);a.artLogs.push(text);renderAuction();toast(text)}
function submit(){const a=state.auction;let bid=Math.max(0,Math.floor(Number($('#bidInput').value)||0));if(!a.tutorial&&bid>state.chips)return toast('报价不能超过当前筹码');if(a.tutorial)bid=Math.min(bid,580);const nb=npcBids();a.bids.push({player:bid,npcs:nb});if(a.round<5){a.round++;a.time=30;a.draft=bid;renderAuction();return}clearInterval(timer);const all=[{id:'player',name:'掌门',bid},...a.npcs.map((n,i)=>({id:'npc'+i,name:n[0],bid:nb[i]}))].sort((x,y)=>y.bid-x.bid),winner=all[0],actual=a.items.reduce((s,i)=>s+i.value,0),won=winner.id==='player',profit=won?actual-bid:0;if(won)state.chips+=profit;if(a.tutorial){state.tutorialDone=true;if(won&&profit<100)state.chips+=100-profit}a.result={winner,actual,profit,won};renderAuction();setTimeout(showResult,state.fast?300:900)}
function showResult(){const r=state.auction.result;$('#result').classList.remove('hidden');$('#resultTitle').textContent=r.won?'掌门拍得整匣':'宝匣由'+r.winner.name+'拍得';$('#resultText').textContent=r.won?(r.profit>=0?'眼力不错，这一匣拍出了利润。':'出价偏高，这一匣出现亏损。'):`你最终报价低了${Math.max(0,r.winner.bid-state.auction.bids.at(-1).player)}筹码；仍可查看完整开箱结果。`;$('#dealValue').textContent=r.winner.bid;$('#actualValue').textContent=r.actual;$('#profitValue').textContent=r.won?(r.profit>=0?`+${r.profit}`:r.profit):'未拍得';$('#profitValue').style.color=r.won&&r.profit>=0?'#418247':'#a24835';$('#nextBtn').textContent=state.chests>=3?'返回房间':'继续下一匣'}function finishChest(){state.auction=null;renderLobby()}function leave(){state.spirit+=state.chips;state.chips=0;state.auction=null;renderLobby();toast('剩余筹码已全部退回灵石')}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{const a=state.auction;if(!a||a.result)return;a.time-=state.fast?5:1;if(a.time<=0){a.draft=a.round===1?0:a.bids.at(-1)?.player||0;submit()}else $('#topStatus').textContent=`${state.room.name} · 第${a.round}/5轮 · ${Math.ceil(a.time)}秒 · 筹码${state.chips}`},1000)}
$$('[data-exchange]').forEach(b=>b.onclick=()=>exchange(b.dataset.exchange));$('#tutorialBtn').onclick=()=>startAuction('market',true);$('#submitBid').onclick=submit;$('#bidInput').oninput=e=>{if(state.auction)state.auction.draft=Math.max(0,Number(e.target.value)||0)};$('#nextBtn').onclick=finishChest;$('#leaveBtn').onclick=leave;$('#fastBtn').onclick=()=>{state.fast=!state.fast;$('#fastBtn').textContent=state.fast?'加速已开':'试玩加速';toast(state.fast?'倒计时速度×5':'恢复正常30秒倒计时')};$('#resetBtn').onclick=()=>location.reload();renderLobby()})();
</script></body></html>
