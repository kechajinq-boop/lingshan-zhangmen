function itemPlace(it){return `第${it.x+1}列、第${it.y+1}行${it.shape.w}×${it.shape.h}轮廓`}function bidBase(a){return a.bids.at(-1)?.player||0}function suggested(kind){const base=bidBase(state.auction),rate=kind==='plus20'?1.2:kind==='plus50'?1.5:1.7;return Math.round(base*rate)}function likesType(role,type){const liked=role==='丹修'?['丹药','灵植']:role==='剑修'?['法器','灵材']:['灵材','法器','功法'];return liked.includes(type)}function clueSignal(a,role){const auraRank={gray:0,blue:0,purple:1,orange:2,gold:3};let signal=1;for(const c of a.clues.slice(0,a.round)){if(c.kind==='quality')signal*=1+(auraRank[c.aura]||0)*.025;if(c.kind==='price')signal*=1+Math.min(.1,c.share*.18);if(c.kind==='profile')signal*=1+rarity.indexOf(c.rarity)*.05;if(c.kind==='type'||c.kind==='profile')signal*=likesType(role,c.type)?(c.kind==='profile'?1.18:1.08):.98}return signal}function clueReaction(a,clue){if(clue.kind!=='profile')return'';const interested=a.npcs.filter(n=>likesType(n[1],clue.type)).map(n=>n[0]);return interested.length?`线索反应：${interested.join('、')}听闻“${rarityName[clue.rarity]}${clue.type}”，竞价意愿明显上升。`:`线索反应：真实类型与品质公开，所有竞拍者重新修正了估值。`}function renderTopStatus(a,locked){$('#topStatus').innerHTML=`${state.room.name} · 第${a.round}/5轮 · 灵石${state.spirit} · 筹码${state.chips} · 鉴宝师Lv${appraiserLevel(state.appraiserXp)} <span class="countdown ${locked?'locked':''}">${locked?'报价已锁定':Math.ceil(a.time)+'秒'}</span>`}function updateLogButton(){const log=$('#artLog'),button=$('#logNext');if(!log||!button)return;const overflow=log.scrollHeight>log.clientHeight+4;button.disabled=!overflow;button.textContent=overflow&&log.scrollTop+log.clientHeight>=log.scrollHeight-4?'回到顶部 ↑':'下翻记事 ↓'}function flipLog(){const log=$('#artLog');if(log.scrollHeight<=log.clientHeight+4)return;const atBottom=log.scrollTop+log.clientHeight>=log.scrollHeight-4;log.scrollTo({top:atBottom?0:Math.min(log.scrollHeight,log.scrollTop+Math.max(60,log.clientHeight*.72)),behavior:'smooth'});setTimeout(updateLogButton,260)}function npcBids(){const a function renderAuction(){persist();const a=state.auction,locked=a.phase==='reveal',visible=a.items.filter(i=>i.revealRound<=a.round).length,roundUsed=a.usedRounds.includes(a.round);renderTopStatus(a,locked);$('#chestTitle').textContent=a.tutorial?'免费教学宝匣':'玄纹宝匣';$('#chestMeta').textContent=`${a.items.length}件 · 本轮显光 ${visible}/${a.items.length}`;const last=a.bids.at(-1);$('#players').innerHTML=[['掌门','玩家'],...a.npcs.map(n=>[n[0],n[1]])].map((p,i)=>{const out=i>0&&a.withdrawn.includes(i-1),shown=last?(i===0?last.player:last.npcs[i-1]):0,portrait=i===0?'player-master.png':`npc-${assetNumber(a.npcs[i-1][4])}.png`;return `<div class="player ${i===0?'me':''} ${out?'withdrawn':''}"><div class="avatar"><img src="./assets/npc/${portrait}" alt=""></div><div class="p-name">${p[0]} · ${p[1]}</div><div class="p-bid">${out?'已退出竞拍':last?`${locked?'本轮':'上轮'} ${shown}筹码`:'等待本轮报价'}</div></div>`}).join('');const grid=$('#grid');grid.innerHTML=Array(80).fill('<i class="cell"></i>').join('');a.items.forEach((it,index)=>{const auraClass=a.result?'revealed r-'+it.rarity:it.revealRound<=a.round?'aura-'+it.aura:'aura-hidden',marked=index===a.activeMark,typeKnown=Boolean(a.result||a.clues.slice(0,a.round).some(c=>c.itemIndex===index&&c.revealsType)),d=document.createElement('div');d.className=`treasure ${auraClass} ${marked?'marked':''} ${typeKnown?'type-known':''}`;d.dataset.revealRound=String(it.revealRound);d.dataset.w=String(it.shape.w);d.dataset.h=String(it.shape.h);d.dataset.itemIndex=String(index);d.dataset.typeKnown=String(typeKnown);d.style.left=`${it.x*10}%`;d.style.top=`${it.y*12.5}%`;d.style.width=`${it.shape.w*10}%`;d.style.height=`${it.shape.h*12.5}%`;d.innerHTML=`<img src="./assets/treasure/treasure-${assetNumber(it.art)}.png" alt=""><span class="type-badge">${it.type}</span>`;d.title=a.result?`${it.name} · ${rarityName[it.rarity]} · ${it.value}灵石`:typeKnown?`已确认类型：${it.type}`:'类型与宝物原貌尚未揭晓';d.style.transitionDelay=`${index*35}ms`;grid.append(d)});$('#roundNote').textContent=l function appraise(kind){const a=state.auction;if(a.phase!=='thinking'||a.used.length>=2||a.used.includes(kind)||a.usedRounds.includes(a.round))return;const indices=[...a.items.keys()],publicItem=i=>a.publicFacts.some(f=>f!==undefined&&!f.startsWith('type-group')&&f.endsWith(`:${i}`)),knownItem=i=>publicItem(i)||a.privateMarks.includes(i),best=[...indices].sort((x,y)=>a.items[y].value-a.items[x].value),rare=[...indices].sort((x,y)=>rarity.indexOf(a.items[y].rarity)-rarity.indexOf(a.items[x].rarity)),cheap=[...indices].sort((x,y)=>a.items[x].value-a.items[y].value),shapeI=best.find(i=>!knownItem(i))??best.find(i=>!a.privateMarks.includes(i))??best[0],auraI=rare.find(i=>!knownItem(i))??rare.find(i=>!a.privateMarks.includes(i))??rare[0],priceI=best.find(i=>!knownItem(i))??best.find(i=>!a.privateMarks.includes(i))??best[0],fakeI=cheap.find(i=>!knownItem(i))??cheap.find(i=>!a.privateMarks.includes(i))??cheap[0];let text='',markedIndex=-1;if(kind==='shape'){markedIndex=shapeI;text=`辨形术：未被公开线索点明的重宝脚点位于${itemPlace(a.items[shapeI])}。`}if(kind==='aura'){markedIndex=auraI;text=`观气术：穿透伪光，${itemPlace(a.items[auraI])}的真实品质为${rarityName[a.items[auraI].rarity]}。`}if(kind==='price'){markedIndex=priceI;text=`问价符：${itemPlace(a.items[priceI])}的单件行价约为${a.items[priceI].value}灵石。`}if(kind==='fake'){markedIndex=fakeI;text=`排伪诀：${itemPlace(a.items[fakeI])}只是低价诱饵，外显光环不可尽信。`}if(markedIndex>=0&&!a.privateMarks.includes(markedIndex))a.privateMarks.push(markedIndex);a.activeMark=markedIndex;a.used.push(kind);a.usedRounds.push(a.round);a.artLogs.push(`第${a.round}轮私人鉴宝：${text}`);renderAuction();toast(text)}
function closeThreat(){$('#threatModal').classList.add('hidden')}function openThreat(){const a=state.auction;if(a.phase!=='thinking'||a.threatUsed)return;const choices=a.npcs.map((n,i)=>({n,i})).filter(x=>!a.withdrawn.includes(x.i));a.threatSelection=choices[0].i;const cost=a.tutorial?0:threatCosts[state.room.id],chance=Math.min(70,20+Math.min(25,state.rep/20)+appraiserLevel(state.appraiserXp)*3);$('#threatIntro').textContent=`选择一名竞拍者释放神识。预计成功率${Math.round(chance)}%，${cost?`无论成败消耗${cost}灵石。`:'教学匣本次不消耗灵石。'}`;$('#threatChoices').classList.remove('hidden');$('#threatChoices').innerHTML=choices.map((x,j)=>`<button class="threat-choice ${j===0?'active':''}" data-threat-target="${x.i}">${x.n[0]}<br><small>${x.n[1]} · 上轮${a.bids.at(-1)?.npcs[x.i]||0}</small></button>`).join('');$$('[data-threat-target]').forEach(b=>b.onclick=()=>{a.threatSelection=Number(b.dataset.threatTarget);$$('[data-threat-target]').forEach(x=>x.classList.toggle('active',x===b))});$('#threatOutcome').classList.add('hidden');$('#threatOutcome').innerHTML='';$('#threatConfirm').classList.remove('hidden');$('#threatCancel').textContent='暂且收手';$('#threatConfirm').onclick=resolveThreat;$('#threatCancel').onclick=closeThreat;$('#threatModal').classList.remove('hidden')}
function resolveThreat(){const a=state.auction,index=a.threatSelection,cost=a.tutorial?0:threatCosts[state.room.id];if(state.spirit<cost){closeThreat();return toast(`神识威慑需要${cost}灵石`)}state.spirit-=cost;a.threatUsed=true;const chance=Math.min(70,20+Math.min(25,state.rep/20)+appraiserLevel(state.appraiserXp)*3),success=Math.random()*100<chance,line=threatLines[rand(0,threatLines.length-1)],reply=(success?threatSuccess:threatFail)[rand(0,(success?threatSuccess:threatFail).length-1)];if(success)a.withdrawn.push(index);a.artLogs.push(`神识威慑：掌门对${a.npcs[index][0]}道：“${line}”`,`${a.npcs[index][0]}回应：“${reply}”${success?'（退出竞拍）':'（威慑失败，灵石已消耗）'}`);$('#threatChoices').classList.add('hidden');$('#threatOutcome').classList.remove('hidden');$('#threatOutcome').innerHTML=`<b>${success?'威慑成功':'威慑失败'}</b><br>掌门：“${line}”<br>${a.npcs[index][0]}：“${reply}”`;$('#threatConfirm').classList.add('hidden');$('#threatCancel').textContent='收下结果';renderAuction()}
function settle(){const a=state.auction,last=a.bids.at(-1),bid=last.player;clearInterval(timer);const all=[{id:'player',name:'掌门',bid},...a.npcs.map((n,i)=>({id:'npc'+i,name:n[0],bid:a.withdrawn.includes(i)?0:last.npcs[i]}))].sort((x,y)=>y.bid-x.bid),winner=all[0],actual=a.items.reduce((s,i)=>s+i.value,0),won=winner.id==='player',profit=won?actual-bid:0,oldLevel=appraiserLevel(state.appraiserXp),xpGain=a.tutorial?0:state.room.xp+(won?5:0);if(won)state.chips+=profit;if(a.tutorial){state.tutorialDone=true;if(won&&profit<100)state.chips+=100-profit}else{state.appraiserXp+=xpGain;state.sessionXp+=xpGain}const newLevel=appraiserLevel(state.appraiserXp);a.result={winner,actual,profit,won,xpGain,oldLevel,newLevel};renderAuction();setTimeout(showResult,state.fast?300:900)}
function submit(){const a=state.auction;if(a.phase==='reveal'){if(a.round>=5)return settle();a.round++;a.time=45;a.phase='thinking';a.draft=a.bids.at(-1).player;const clue=a.clues[a.round-1];a.activeMark=clue.itemIndex??null;a.artLogs.push(`第${a.round}轮：${clue.text}`);const reaction=clueReaction(a,clue);if(reaction)a.artLogs.push(reaction);renderAuction();return}const cap=a.tutorial?580:state.chips,previous=bidBase(a);let bid=Math.max(0,Math.floor(Number($('#bidInput').value)||0));if(bid>cap)return toast('报价不能超过当前筹码');if(a.round>1&&bid<previous)return toast(`本轮报价不能低于上轮${previous}筹码`);a.draft=bid;const nb=npcBids();a.bids.push({player:bid,npcs:nb});a.artLogs.push(`第${a.round}轮报价：掌门${bid}；${a.npcs.map((n,i)=>`${n[0]}${a.withdrawn.includes(i)?'退出':nb[i]}`).join('；')}`);a.phase='reveal';renderAuction()}
function showResult(){const r=state.auction.result,margin=r.winner.bid?Math.round((r.actual-r.winner.bid)/r.winner.bid*100):0,levelText=r.newLevel>r.oldLevel?`鉴宝师升级：Lv.${r.oldLevel} → Lv.${r.newLevel}`:`鉴宝阅历 +${r.xpGain}`;$('#result').classList.remove('hidden');$('#resultTitle').textContent=r.won?'掌门拍得整匣':'宝匣由'+r.winner.name+'拍得';const outcome=r.won?(r.profit>=0?`这一匣净赚${r.profit}灵石，成交后潜在收益率${margin}%。`:'出价偏高，这一匣出现亏损。'):`成交价与宝匣总值相差${r.actual-r.winner.bid}灵石；你仍可查看完整开箱结果。`;$('#resultText').innerHTML=`${outcome}<br><span class="xp-gain">${levelText}</span>`;$('#dealValue').textContent=r.winner.bid;$('#actualValue').textContent=r.actual;$('#profitValue').textContent=r.won?(r.profit>=0?`+${r.profit}`:r.profit):'未拍得';$('#profitValue').style.color=r.won&&r.profit>=0?'#418247':'#a24835';$('#nextBtn').textContent=state.chests>=3?'结束本次寸金阁':'继续下一匣'}function openChipDecision(){const current=appraiserLevel(state.appraiserXp),upgrade=current>state.startLevel;$('#chipSummary').innerHTML=`本场获得 <b>${state.sessionXp}</b> 鉴宝阅历。${upgrade?`<span class="xp-gain">鉴宝师已由Lv.${state.startLevel}升至Lv.${current}。</span>`:`当前鉴宝师Lv.${current}，距离下一等级还差${Math.max(0,nextXp(state.appraiserXp)-state.appraiserXp)}阅历。`}<br>剩余筹码可保留到下次开阁，也可按1:1折算为灵石。`;$('#chipBalance').textContent=`当前剩余 ${state.chips} 筹码 · 累计阅历 ${state.appraiserXp}`;$('#chipModal').classList.remove('hidden')}function finishChest(){if(state.chests>=3)return openChipDecision();state.auction=null;renderLobby()}function leave(){openChipDecision()}function keepChips(){$('#chipModal').classList.add('hidden');state.auction=null;renderLobby();toast('筹码已保留，下一次开阁可以继续使用')}function cashOutChips(){const amount=state.chips;state.spirit+=amount;state.chips=0;$('#chipModal').classList.add('hidden');state.auction=null;renderLobby();toast(`${amount}筹码已折算为灵石`)}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{const a=state.auction;if(!a||a.result||a.phase!=='thinking')return;a.time-=state.fast?5:1;if(a.time<=0){const previous=bidBase(a);if(a.round>1&&a.draft<previous)a.draft=previous;submit()}else renderTopStatus(a,false)},1000)}
$$('[data-exchange]').forEach(b=>b.onclick=()=>exchange(b.dataset.exchange));$('#tutorialBtn').onclick=()=>startAuction('market',true);$('#submitBid').onclick=submit;$('#bidInput').oninput=e=>{if(state.auction&&state.auction.phase==='thinking')state.auction.draft=Math.max(0,Number(e.target.value)||0)};$('#nextBtn').onclick=finishChest;$('#leaveBtn').onclick=leave;$('#keepChips').onclick=keepChips;$('#cashOutChips').onclick=cashOutChips;const qaMode=new URLSearchParams(location.search).has('qa');if(qaMode)window.__cunjingeQa={rooms,makeItems,appraiserLevel,xpThresholds,rarity};if(!qaMode)$('#fastBtn').classList.add('hidden');$('#fastBtn').onclick=()=>{state.fast=!state.fast;$('#fastBtn').textContent=state.fast?'加速已开':'验收加速';toast(state.fast?'倒计时速度×5':'恢复正常45秒倒计时')};$('#returnBtn').onclick=()=>{if(state.auction)return toast('请先完成本匣并选择离开');persist();location.href='../'};if(state.auction){$('#lobby').classList.add('hidden');$('#arena').classList.remove('hidden');renderAuction();if(state.auction.result)showResult();else startTimer()}else renderLobby()})();
