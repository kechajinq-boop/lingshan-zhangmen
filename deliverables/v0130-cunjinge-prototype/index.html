<main class="app" id="app"><header class="top"><div class="brand">灵山大掌门<small>寸金阁玩法试玩</small></div><div class="status" id="topStatus"></div><div class="top-actions"><button class="mini jade" id="fastBtn">试玩加速</button><button class="mini" id="resetBtn">重置</button></div></header><section class="stage">
<div class="lobby panel" id="lobby"><div class="lobby-head"><div><h1>万宝会今日开阁</h1><p>每次最多竞拍3匣，三个房间共用同一筹码钱包；本试玩从第7天开放日开始。</p></div><div><b>鉴宝师 Lv.1</b><br><small>阅历 0 / 150</small></div></div><div class="wallet"><span>宗门灵石 <b id="spirit">30000</b></span><span>临时筹码 <b id="chips">0</b></span><button class="chip-btn" data-exchange="500">兑换500</button><button class="chip-btn" data-exchange="5000">兑换5000</button><button class="chip-btn" data-exchange="20000">兑换20000</button><button class="chip-btn" data-exchange="all">兑换全部</button></div><div class="rooms" id="rooms"></div><div class="lobby-foot"><span>试玩规则：离阁退回剩余筹码；兑换时保留至少500灵石或15%运营金。</span><button class="tutorial" id="tutorialBtn">先玩免费教学匣</button></div></div>
<div class="arena hidden" id="arena"><section class="chest-panel panel"><div class="chest-head"><b id="chestTitle">玄纹宝匣</b><span id="chestMeta"></span></div><div class="grid" id="grid"></div><div class="legend">光环与轮廓公开，但外显品质未必是真相</div></section><section class="right"><div class="players" id="players"></div><div class="decision panel"><div class="clues"><div class="section-title">本轮线索 · 看完再报价</div><div class="round-note" id="roundNote"></div><div class="clue-list" id="clues"></div></div><div class="appraisal"><div class="section-title">私人鉴宝 <span id="uses"></span></div><div class="estimate" id="estimate"></div><div class="arts" id="arts"></div><div class="threat"><select id="threatTarget" aria-label="威慑目标"></select><button id="threatBtn">神识威慑</button></div><div class="art-log" id="artLog"></div></div></div><div class="bidding panel"><button class="quick" data-bid="plus20">+20%</button><button class="quick" data-bid="plus50">+50%</button><button class="quick" data-bid="plus70">+70%</button><div class="bidbox"><span>筹码</span><input id="bidInput" inputmode="numeric" type="number" min="0" value="0"></div><button class="submit" id="submitBid">锁定本轮报价</button></div></section></div></section>
<div class="result hidden" id="result"><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stats"><div class="stat">成交价<b id="dealValue"></b></div><div class="stat">宝匣总值<b id="actualValue"></b></div><div class="stat">玩家盈亏<b id="profitValue"></b></div></div><div class="result-actions"><button id="leaveBtn">离开寸金阁</button><button id="nextBtn">继续下一匣</button></div></div></div></main>
<script>
(()=>{const rooms=[{id:'market',name:'散修集市',chips:500,rep:0,min:300,max:1500,color:'散修、旧货与偶遇的小机缘'},{id:'cloud',name:'云海宝会',chips:5000,rep:100,min:3000,max:15000,color:'行家汇聚，紫色宝物开始常见'},{id:'heaven',name:'九霄仙拍',chips:20000,rep:300,min:12000,max:80000,color:'高风险高回报，偶见红色重宝'}],npcs=[['丹霞子','丹修',.93,.08],['顾听剑','剑修',1.05,.12],['金算盘','行商',.98,.16],['沈绛雪','丹修',1.08,.06],['燕回雪','剑修',.9,.14],['白掌柜','行商',1.02,.1],['百草翁','丹修',.87,.05],['宁藏锋','剑修',1.1,.13],['钱有余','行商',.95,.18]],names=['百年灵草','月华露','赤焰莲','云纹芝','聚灵丹','筑基丹','凝剑丸','化神丹','灵矿原石','星纹铁','寒髓玉','大日精金','青锋剑','霜魄古剑','纳灵葫芦','护心玉佩','小周天阵盘','三足丹炉','残破万妖幡','无名道印','百草残卷','御剑残篇','阵道秘录','天书残页','雷击灵木','上古香炉','仙鹤尾羽','疑似龙鳞','玉蝉','星河砂'],shapes=[{w:1,h:1,c:1},{w:1,h:2,c:2},{w:2,h:1,c:2},{w:2,h:2,c:4}],rarity=['blue','purple','orange','gold','red'],rarityName={blue:'蓝色',purple:'紫色',orange:'橙色',gold:'金色',red:'红色'},threatLines=['此物与在下有缘，道友与它的缘分，怕是浅了些。','宝物虽好，也得有命带出寸金阁。道友三思。','此匣因果太重，道友把握不住，不如让在下代为承担。','莫要误会，在下并非威胁，只是在替道友趋吉避凶。','道友若肯退一步，今日便算结下一桩善缘。','在下只取此匣。诸位若肯成人之美，日后自然好相见。','价钱可以慢慢加，性命却只有一条，道友可要算清楚。','在下向来与人为善——不与我争，便是善。','道友继续加价，伤的是灵石；再往后，伤的可未必还是灵石。','此物看着平平无奇，想来配不上道友，还是交给在下吧。'],threatSuccess=['道友神识惊人……这匣宝物，在下不要也罢。','今日只当与道友结个善缘，告辞。','宝物虽好，终究不值得拿命去赌。','道友既如此执着，在下便不夺人所爱了。'],threatFail=['寸金阁内以价论宝，道友若有本事，便拿灵石说话。','巧了，在下别的没有，就是命硬。','阁下神识不弱，可惜在下这条命，向来不怎么值钱。','威胁在下？那便再加两成，看看谁先心疼。','道友这番话，拿去吓唬山下散修或许有用。','修仙之人若连这点胆量都没有，还竞什么宝？','在下掐指一算，此匣与我有缘，与道友倒有些破财之缘。'],threatCosts={market:100,cloud:500,heaven:2000},state={spirit:30000,rep:350,chips:0,chests:0,room:null,auction:null,fast:false,tutorialDone:false,appraiser:1};let timer=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,maxExchange=()=>Math.max(0,state.spirit-Math.max(500,Math.ceil(state.spirit*.15)));
function toast(text){const el=document.createElement('div');el.className='toast';el.textContent=text;$('#app').append(el);setTimeout(()=>el.remove(),1850)}
function renderLobby(){clearInterval(timer);$('#lobby').classList.remove('hidden');$('#arena').classList.add('hidden');$('#result').classList.add('hidden');$('#spirit').textContent=state.spirit;$('#chips').textContent=state.chips;$('#topStatus').textContent=`第7天 · 声望${state.rep} · 已参与 ${state.chests}/3匣 · 剩余筹码离场自动退回`;$('#rooms').innerHTML=rooms.map(r=>{const why=state.chests>=3?'本次3匣已用完':state.rep<r.rep?`需要声望${r.rep}`:state.chips<r.chips?`需要${r.chips}筹码`:'';return `<article class="room ${r.id==='cloud'?'cloud':r.id==='heaven'?'high':''}"><h2>${r.name}</h2><p>${r.color}<br>入场筹码：${r.chips}<br>声望门槛：${r.rep}<br>宝匣价值：${r.min}～${r.max}</p><button data-room="${r.id}" ${why?'disabled':''}>${why||'进入竞拍'}</button></article>`}).join('');$$('[data-room]').forEach(b=>b.onclick=()=>startAuction(b.dataset.room,false));$('#tutorialBtn').disabled=state.tutorialDone;$('#tutorialBtn').textContent=state.tutorialDone?'教学已完成':'先玩免费教学匣'}
function exchange(amount){const n=amount==='all'?maxExchange():Math.min(Number(amount),maxExchange());if(n<=0)return toast('必须给宗门保留运营灵石');state.spirit-=n;state.chips+=n;renderLobby();toast(`已兑换${n}筹码`)}
function pickRarity(room){const x=Math.random();if(room.id==='market')return x<.62?0:x<.87?1:x<.97?2:x<.995?3:4;if(room.id==='cloud')return x<.35?0:x<.65?1:x<.86?2:x<.97?3:4;return x<.16?0:x<.38?1:x<.64?2:x<.91?3:4}
function visibleAura(real){if(real==='red')return'gray';if(Math.random()<.16)return'gray';if(real==='gold'&&Math.random()<.28)return'orange';if(real==='orange'&&Math.random()<.22)return'purple';return real}
function makeItems(room,tutorial){const count=tutorial?7:rand(5,13),used=new Set(),items=[];let red=0;for(let i=0;i<count;i++){let shape=shapes[rand(0,shapes.length-1)],pos=null;for(let t=0;t<100;t++){const x=rand(0,10-shape.w),y=rand(0,8-shape.h),cells=[];for(let yy=0;yy<shape.h;yy++)for(let xx=0;xx<shape.w;xx++)cells.push(`${x+xx},${y+yy}`);if(cells.every(c=>!used.has(c))){pos={x,y,cells};break}}if(!pos)continue;pos.cells.forEach(c=>used.add(c));let ri=tutorial?Math.min(2,Math.floor(i/3)):pickRarity(room);if(ri===4&&red>=1)ri=3;if(ri===4)red++;const real=rarity[ri];items.push({name:names[(i*7+rand(0,names.length-1))%names.length],rarity:real,aura:visibleAura(real),shape,x:pos.x,y:pos.y,value:0})}const total=tutorial?680:rand(room.min,room.max),weights=items.map(i=>{let w=Math.pow(2.45,rarity.indexOf(i.rarity));if(i.rarity==='purple')w*=i.shape.c===1?1.35:.45;else w*=.85+Math.random()*.3;return w}),sum=weights.reduce((a,b)=>a+b,0);let assigned=0;items.forEach((it,i)=>{it.value=i===items.length-1?total-assigned:Math.max(1,Math.round(total*weights[i]/sum));assigned+=it.value});return items}
function createClues(items){const total=items.reduce((s,i)=>s+i.value,0),best=[...items].sort((a,b)=>b.value-a.value),rarest=[...items].sort((a,b)=>rarity.indexOf(b.rarity)-rarity.indexOf(a.rarity))[0],largest=[...items].sort((a,b)=>b.shape.c-a.shape.c)[0],purple=items.filter(i=>i.aura==='purple');return [{text:`匣内约有${Math.max(5,items.length-1)}～${Math.min(13,items.length+1)}件宝物，外显灵光可能有伪`,low:.38,high:1.65},{text:`最大轮廓占${largest.shape.c}格；大件灵光旺盛，却未必更值钱`,low:.52,high:1.42},{text:purple.length?`有${purple.length}件呈紫光，鉴宝师提醒：紫光小件反而更需留意`:`未见紫光，灰暗器物中仍可能藏有重宝`,low:.64,high:1.28},{text:`问得：${best[0].name}约值${best[0].value}，${best[1]?.name||rarest.name}约值${best[1]?.value||rarest.value}`,low:.76,high:1.16},{text:`寸金阁给出的最低估值为${Math.floor(total*.9)}，匣中最高真品为${rarityName[rarest.rarity]}`,low:.88,high:1.08}].map((c,i)=>({...c,low:Math.floor(total*c.low),high:Math.ceil(total*c.high),round:i+1}))}
function startAuction(roomId,tutorial){const room=rooms.find(r=>r.id===roomId);if(!tutorial&&state.chests>=3)return;if(!tutorial&&state.chips<room.chips)return toast('筹码不足');const chosen=[...npcs].sort(()=>Math.random()-.5).slice(0,3),items=makeItems(room,tutorial),total=items.reduce((s,i)=>s+i.value,0),startingBid=Math.max(10,Math.round(total*.35/10)*10);state.room=room;state.auction={tutorial,round:1,time:45,phase:'thinking',items,clues:createClues(items),npcs:chosen,bids:[],used:[],artLogs:[],draft:startingBid,startingBid,withdrawn:[],threatUsed:false,result:null};if(!tutorial)state.chests++;$('#lobby').classList.add('hidden');$('#arena').classList.remove('hidden');renderAuction();startTimer()}
function estimate(a){const c=a.clues[a.round-1];return{low:c.low,high:c.high,mid:Math.round((c.low+c.high)/2)}}function bidBase(a){return a.bids.at(-1)?.player||a.startingBid}function suggested(kind){const a=state.auction,base=bidBase(a),rate=kind==='plus20'?1.2:kind==='plus50'?1.5:1.7;return Math.round(base*rate)}function npcBids(){const a=state.auction,e=estimate(a);return a.npcs.map((n,i)=>{if(a.withdrawn.includes(i))return 0;const last=a.bids.at(-1)?.npcs[i]||0,confidence=.6+a.round*.075,bluff=a.round<5&&Math.random()<n[3]?1.12:1,target=e.mid*n[2]*confidence*bluff;return Math.max(0,Math.round((last*.25+target*.75)/5)*5)})}
function renderAuction(){const a=state.auction,e=estimate(a),locked=a.phase==='reveal';$('#topStatus').textContent=`${state.room.name} · 第${a.round}/5轮 · ${locked?'报价已锁定':Math.ceil(a.time)+'秒'} · 灵石${state.spirit} · 筹码${state.chips}`;$('#chestTitle').textContent=a.tutorial?'免费教学宝匣':'玄纹宝匣';$('#chestMeta').textContent=`${a.items.length}件 · 品质：红＞金＞橙＞紫＞蓝`;const last=a.bids.at(-1);$('#players').innerHTML=[['掌门','玩家'],...a.npcs.map(n=>[n[0],n[1]])].map((p,i)=>{const out=i>0&&a.withdrawn.includes(i-1),shown=last?(i===0?last.player:last.npcs[i-1]):0;return `<div class="player ${i===0?'me':''} ${out?'withdrawn':''}"><div class="avatar">${p[0][0]}</div><div class="p-name">${p[0]} · ${p[1]}</div><div class="p-bid">${out?'已退出竞拍':last?`${locked?'本轮':'上轮'} ${shown}筹码`:'等待本轮报价'}</div></div>`}).join('');const grid=$('#grid');grid.innerHTML=Array(80).fill('<i class="cell"></i>').join('');a.items.forEach((it,index)=>{const d=document.createElement('div');d.className=`treasure aura-${it.aura} ${a.result?'revealed r-'+it.rarity:''}`;d.style.left=`${it.x*10}%`;d.style.top=`${it.y*12.5}%`;d.style.width=`${it.shape.w*10}%`;d.style.height=`${it.shape.h*12.5}%`;if(a.result)d.textContent=it.name;d.style.transitionDelay=`${index*35}ms`;grid.append(d)});$('#roundNote').textContent=locked?'本轮报价已锁定，无法修改。确认后揭晓下一轮线索。':`第${a.round}轮线索已经公开，本轮只能提交一次最终报价。`;$('#clues').innerHTML=a.clues.slice(0,a.round).map((c,i)=>`<div class="clue ${i===a.round-1?'new':''}">${i+1}. ${c.text}</div>`).join('');$('#uses').textContent=`剩余${2-a.used.length}次`;$('#estimate').textContent=`当前公开估值：${e.low}～${e.high}`;const arts=[['shape','辨形术'],['aura','观气术'],['price','问价符'],['fake','排伪诀']];$('#arts').innerHTML=arts.map(x=>`<button class="art" data-art="${x[0]}" ${locked||a.used.includes(x[0])||a.used.length>=2?'disabled':''}>${x[1]}</button>`).join('');$$('[data-art]').forEach(b=>b.onclick=()=>appraise(b.dataset.art));const target=$('#threatTarget'),cost=a.tutorial?0:threatCosts[state.room.id];target.innerHTML=a.npcs.map((n,i)=>`<option value="${i}" ${a.withdrawn.includes(i)?'disabled':''}>威慑 ${n[0]}</option>`).join('');target.disabled=locked||a.threatUsed||a.withdrawn.length===a.npcs.length;$('#threatBtn').textContent=`神识威慑${cost?' '+cost:' 免费'}`;$('#threatBtn').disabled=target.disabled;$('#threatBtn').onclick=threaten;$('#artLog').innerHTML=a.artLogs.join('<br>');$('#bidInput').value=a.draft;$('#bidInput').disabled=locked;$$('[data-bid]').forEach(b=>{const amount=Math.min(suggested(b.dataset.bid),a.tutorial?580:state.chips);b.textContent=`${b.dataset.bid==='plus20'?'+20%':b.dataset.bid==='plus50'?'+50%':'+70%'} · ${amount}`;b.disabled=locked;b.onclick=()=>{a.draft=amount;$('#bidInput').value=amount;$$('[data-bid]').forEach(x=>x.classList.toggle('active',x===b))}});$('#submitBid').textContent=locked?(a.round<5?'查看下一轮线索':'揭晓宝匣'):'锁定本轮报价';$('#submitBid').classList.toggle('next',locked);$('#submitBid').disabled=false}
function appraise(kind){const a=state.auction;if(a.phase!=='thinking'||a.used.length>=2||a.used.includes(kind))return;const best=[...a.items].sort((x,y)=>y.value-x.value);let text='';if(kind==='shape')text=`辨形：最大轮廓是一件${best[0].name}`;if(kind==='aura')text=`观气：${best.slice(0,3).map(x=>x.name+'呈'+rarityName[x.rarity]+'真光').join('、')}`;if(kind==='price')text=`问价：${best.slice(0,2).map(x=>x.name+'='+x.value).join('、')}`;if(kind==='fake')text=a.items.some(x=>x.name.includes('残')||x.name.includes('原石'))?'排伪：发现一件低价值杂物':'排伪：未发现明显赝品';a.used.push(kind);a.artLogs.push(text);renderAuction();toast(text)}
function threaten(){const a=state.auction;if(a.phase!=='thinking'||a.threatUsed)return;const index=Number($('#threatTarget').value),cost=a.tutorial?0:threatCosts[state.room.id];if(state.spirit<cost)return toast(`神识威慑需要${cost}灵石`);state.spirit-=cost;a.threatUsed=true;const chance=Math.min(70,20+Math.min(25,state.rep/20)+state.appraiser*3),success=Math.random()*100<chance,line=threatLines[rand(0,threatLines.length-1)],reply=(success?threatSuccess:threatFail)[rand(0,(success?threatSuccess:threatFail).length-1)];if(success)a.withdrawn.push(index);a.artLogs.push(`掌门：“${line}”`,`${a.npcs[index][0]}：“${reply}”${success?'（退出竞拍）':'（威慑失败）'}`);renderAuction();toast(success?`${a.npcs[index][0]}已被逼退`:'威慑失败，灵石仍已消耗')}
function settle(){const a=state.auction,last=a.bids.at(-1),bid=last.player;clearInterval(timer);const all=[{id:'player',name:'掌门',bid},...a.npcs.map((n,i)=>({id:'npc'+i,name:n[0],bid:a.withdrawn.includes(i)?0:last.npcs[i]}))].sort((x,y)=>y.bid-x.bid),winner=all[0],actual=a.items.reduce((s,i)=>s+i.value,0),won=winner.id==='player',profit=won?actual-bid:0;if(won)state.chips+=profit;if(a.tutorial){state.tutorialDone=true;if(won&&profit<100)state.chips+=100-profit}a.result={winner,actual,profit,won};renderAuction();setTimeout(showResult,state.fast?300:900)}
function submit(){const a=state.auction;if(a.phase==='reveal'){if(a.round>=5)return settle();a.round++;a.time=45;a.phase='thinking';a.draft=a.bids.at(-1).player;renderAuction();return}let bid=Math.max(0,Math.floor(Number($('#bidInput').value)||0));if(!a.tutorial&&bid>state.chips)return toast('报价不能超过当前筹码');if(a.tutorial)bid=Math.min(bid,580);a.draft=bid;a.bids.push({player:bid,npcs:npcBids()});a.phase='reveal';renderAuction()}
function showResult(){const r=state.auction.result;$('#result').classList.remove('hidden');$('#resultTitle').textContent=r.won?'掌门拍得整匣':'宝匣由'+r.winner.name+'拍得';$('#resultText').textContent=r.won?(r.profit>=0?'眼力不错，这一匣拍出了利润。':'出价偏高，这一匣出现亏损。'):`你最终报价低了${Math.max(0,r.winner.bid-state.auction.bids.at(-1).player)}筹码；仍可查看完整开箱结果。`;$('#dealValue').textContent=r.winner.bid;$('#actualValue').textContent=r.actual;$('#profitValue').textContent=r.won?(r.profit>=0?`+${r.profit}`:r.profit):'未拍得';$('#profitValue').style.color=r.won&&r.profit>=0?'#418247':'#a24835';$('#nextBtn').textContent=state.chests>=3?'返回房间':'继续下一匣'}function finishChest(){state.auction=null;renderLobby()}function leave(){state.spirit+=state.chips;state.chips=0;state.auction=null;renderLobby();toast('剩余筹码已全部退回灵石')}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{const a=state.auction;if(!a||a.result||a.phase!=='thinking')return;a.time-=state.fast?5:1;if(a.time<=0)submit();else $('#topStatus').textContent=`${state.room.name} · 第${a.round}/5轮 · ${Math.ceil(a.time)}秒 · 灵石${state.spirit} · 筹码${state.chips}`},1000)}
$$('[data-exchange]').forEach(b=>b.onclick=()=>exchange(b.dataset.exchange));$('#tutorialBtn').onclick=()=>startAuction('market',true);$('#submitBid').onclick=submit;$('#bidInput').oninput=e=>{if(state.auction&&state.auction.phase==='thinking')state.auction.draft=Math.max(0,Number(e.target.value)||0)};$('#nextBtn').onclick=finishChest;$('#leaveBtn').onclick=leave;$('#fastBtn').onclick=()=>{state.fast=!state.fast;$('#fastBtn').textContent=state.fast?'加速已开':'试玩加速';toast(state.fast?'倒计时速度×5':'恢复正常45秒倒计时')};$('#resetBtn').onclick=()=>location.reload();renderLobby()})();
</script></body></html>
