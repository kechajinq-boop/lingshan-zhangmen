name: Deploy GitHub Pages

on:
  push:
    branches:
      - codex/v0.12.1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Build v0.12.4-R1 candidate
        working-directory: candidate
        run: npm ci && npm run build

      - name: Checkout stable v0.12.4
        uses: actions/checkout@v6
        with:
          ref: codex/v0.12.4
          path: stable

      - name: Build stable v0.12.4
        working-directory: stable
        run: npm ci && npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/releases/v0.12.4-r1
          cp -a stable/dist/. site/
          cp -a candidate/dist/. site/releases/v0.12.4-r1/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
